<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    const SITE_CONFIG = {
      // 站点基础
      siteTitle: "遗失 · 未绘之地",
      bannerTitle: "遗失 · 未绘之地",
      bannerSub: "Unmapped",

      // 联系邮箱
      contactEmail: "pingtanzhirun@outlook.com",

      // 版权信息
      copyrightStartYear: "2024",
      copyrightEndYear: "2026",
      copyrightAuthor: "洛夜 de 夜（星小夜）",

      // 轮播图列表｜一张一条：图片地址、替代文字、目标详情 ID
      carouselList: [
        {
          imgSrc: "haibao.png",
          imgAlt: "原创故事",
          targetDetailId: "detail-0"
        },
        {
          imgSrc: "godot.jpg",
          imgAlt: "游戏开发",
          targetDetailId: "detail-1"
        },
        {
          imgSrc: "weihuitujian.jpg",
          imgAlt: "维基",
          targetDetailId: "detail-2"
        }
      ],

      // 跳转链接（全部放这里）
      links: {
        storyPlatform: "", // 小说发布平台链接
        githubRepo: "",  // GitHub 仓库下载链接
        wiki: "", // 内测资格申请链接  
        testApply: "",  // BWiki 维基百科链接 
        qqGroup: "",    // QQ 群链接 
        qqChannel: "https://pd.qq.com/s/avuschctw?b=9",// QQ 频道链接 
        kuaishou: "https://v.kuaishou.com/nZ5oSEcT", // 快手主页链接   
        xiaohongshu: "https://xhslink.cn/o/7YTnvwyd6Be",// 小红书主页链接    
        bilibili: "https://b23.tv/tWhLr6i",// B站主页链接  
        lofter: "https://xing-xiaoye.lofter.com"// 老福特主页链接
      },

      // 详情卡片文案
      cardText: {
         story: {
        title: "原创故事 / 遗失·未绘之地",
        desc: "梗概：星意外坠入崩坏的异界层级，遇见了只剩残魂的猫耳少女猫汀兰。为了重铸她的躯体，他们签下了灵魂契约。在无尽的世界与未知的冒险中，寻找属于他们的明天，守护他们间一生的誓言——回家。点击下方按钮前往微信公众号观看完整故事。",
        note: "© 2024-2026 星小夜 著作权已登记 | 未经许可禁止搬运、二次改编。"
      },
        dev: {
          title: "游戏开发",
          desc: "正在使用 Godot 4.5.2 开发游戏，文字游戏+各类玩法，包含许多未公开的精美插图，大量支线，适合喜欢视觉体验的领航员，持续开发中。",
          note: "当前状态：开发中，微型规模限量放出测试资格。"
        },
        community: {
          title: "社区、讨论与维基",
          desc: "欢迎加入 我的QQ频道、QQ群，快来一起讨论故事与游戏吧。",
          note: "未绘图鉴（维基搭建中）：收录了遗失未绘之地及其附属作品的所有层级、词条、人物介绍、世界观资料。"
        },
        support: {
          title: "个人 / 社团支持",
          desc: "月莹，谢太傅"
        },
        about: {
          title: "关于我们",
          desc: "星小夜（洛夜de夜），一名初三在读的独立创作者。作为《遗失·未绘之地》的原作者、编剧兼底层架构师，同时，也是一名资深的鱼航员，收听了七夜1027小时，谢谢七宝的陪伴，我致力于用代码和文字，把自己心中的世界展现在世界面前，为自己和所有‘领航员’建造一个永远不会被现实剥夺的避风港。"
        }
      },

      // 按钮文字
      btnText: {
        watchStory: "前往微信公众号主页",
        github: "前往 GitHub 仓库，发布页",
        applyTest: "申请测试资格",
        wiki: "未绘图鉴（维基）",
        qqGroup: "QQ 群",
        qqChannel: "QQ 频道",
        copyMail: "复制联系邮箱",
        kuaishou: "快手",
        xiaohongshu: "小红书",
        bilibili: "B站",
        lofter: "老福特"
      },

      // 样式微调（不用进 CSS）
      style: {
        gapSize: 10,
        transitionCurve: "cubic-bezier(0.22, 0.61, 0.36, 1)",
        slideThreshold: 50
      }
    };
  </script>

  <title id="dynamicTitle"></title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #e8f4fd;
      font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
      padding: 14px;
    }
    .container-wrap {
      max-width: 860px;
      margin: 0 auto;
    }
    .top-banner {
      background: linear-gradient(135deg, #2078d6, #54b8ee);
      border-radius: 16px;
      padding: 26px 18px;
      color: #ffffff;
      margin-bottom: 18px;
    }
    .top-banner h1 {
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .top-banner p {
      font-size: 14px;
      opacity: 0.9;
    }
    .top-carousel-wrap {
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #d0e8f8;
      background: #ffffff;
      margin-bottom: 14px;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }
    .carousel-track {
      display: flex;
    }
    .carousel-item {
      min-width: calc(100% - 10px);
      height: 240px;
      border-radius: 14px;
      border: 1px solid #bfe0f5;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .carousel-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .carousel-item:hover {
      transform: scale(0.985);
      box-shadow: 0 8px 20px rgba(32, 120, 214, 0.18);
    }
    .carousel-item:active {
      transform: scale(0.96);
    }
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #9ecbed;
      color: #1f72b8;
      font-size: 20px;
      cursor: pointer;
      z-index: 3;
      display: grid;
      place-items: center;
      transition: 0.2s;
    }
    .carousel-arrow:hover {
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(32, 120, 214, 0.25);
    }
    .carousel-arrow.left { left: 10px; }
    .carousel-arrow.right { right: 10px; }
    .carousel-dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 10px 0 16px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #b8dcf0;
      cursor: pointer;
      transition: 0.3s ease;
    }
    .dot.active {
      background: #2078d6;
      width: 32px;
      box-shadow: 0 0 6px #44aaff;
    }
    .dot-tip {
      text-align: center;
      font-size: 13px;
      color: #5588aa;
      margin-bottom: 20px;
    }
    .detail-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #d0e8f8;
      padding: 20px;
      margin-bottom: 16px;
      position: relative;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .detail-card.show {
      opacity: 1;
      transform: translateY(0);
    }
    .round-tag {
      display: none;
    }
    .section-title {
      font-size: 20px;
      color: #1f72b8;
      margin-bottom: 10px;
    }
    .split-line {
      height: 1px;
      background-color: #c8e6fb;
      margin: 16px 0;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .blue-btn {
      background: #ffffff;
      border: 1px solid #88c8ee;
      color: #1f72b8;
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s ease;
    }
    .blue-btn:hover {
      background-color: #d8f0fc;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(32, 120, 214, 0.2);
    }
    .copy-tip {
      color: #28a745;
      display: none;
      margin-top: 8px;
      font-size: 14px;
    }
    .footer-area {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
      color: #447799;
      line-height: 1.7;
    }
    @media (max-width: 520px) {
      .top-banner h1 { font-size: 24px; }
      .carousel-item { height: 180px; }
      .carousel-arrow { width: 34px; height: 34px; font-size: 17px; }
    }
  </style>
</head>

<body>
  <div class="container-wrap">
    <header class="top-banner">
      <h1 id="bannerH1"></h1>
      <p id="bannerSubP"></p>
    </header>

    <section class="top-carousel-wrap" id="carouselWrap">
      <div class="carousel-track" id="carouselTrack"></div>
      <button class="carousel-arrow left" id="arrowLeft">‹</button>
      <button class="carousel-arrow right" id="arrowRight">›</button>
    </section>

    <div class="carousel-dots" id="dotWrap"></div>
    <p class="dot-tip"></p>

    <section class="detail-card" id="detail-0">
      <span class="round-tag">01</span>
      <h2 class="section-title" id="cardStoryTitle"></h2>
      <div class="split-line"></div>
      <p id="cardStoryDesc"></p>
      <p style="margin-top: 8px; font-size: 13px; color: #6688aa;" id="cardStoryNote"></p>
      <div class="btn-group">
        <button class="blue-btn" id="btnWatchStory"></button>
      </div>
    </section>

    <section class="detail-card" id="detail-1">
      <span class="round-tag">02</span>
      <h2 class="section-title" id="cardDevTitle"></h2>
      <div class="split-line"></div>
      <p id="cardDevDesc"></p>
      <p style="margin-top: 8px;" id="cardDevNote"></p>
      <div class="btn-group">
        <button class="blue-btn" id="btnGithub"></button>
        <button class="blue-btn" id="btnTest"></button>
      </div>
    </section>

    <section class="detail-card" id="detail-2">
      <span class="round-tag">03</span>
      <h2 class="section-title" id="cardCommunityTitle"></h2>
      <div class="split-line"></div>
      <p id="cardCommunityDesc"></p>
      <p style="margin-top: 8px;" id="cardCommunityNote"></p>
      <div class="btn-group">
        <button class="blue-btn" id="btnQQChannel"></button>
        <button class="blue-btn" id="btnQQGroup"></button>
        <button class="blue-btn" id="btnWiki"></button>
      </div>
    </section>

    <section class="detail-card">
      <span class="round-tag">04</span>
      <h2 class="section-title" id="cardSupportTitle"></h2>
      <div class="split-line"></div>
      <p style="color: #5588aa;" id="cardSupportDesc"></p>
    </section>

    <section class="detail-card">
      <span class="round-tag">05</span>
      <h2 class="section-title" id="cardAboutTitle"></h2>
      <div class="split-line"></div>
      <p id="cardAboutCreator"></p>
      <p style="margin-top: 6px;" id="cardAboutDesc"></p>
      <div class="btn-group">
        <button class="blue-btn" id="btnCopyMail"></button>
      </div>
      <p class="copy-tip" id="copy-ok">复制到剪贴板</p>
      <div class="btn-group">
        <button class="blue-btn" id="btnKS"></button>
        <button class="blue-btn" id="btnXHS"></button>
        <button class="blue-btn" id="btnBili"></button>
        <button class="blue-btn" id="btnLofter"></button>
      </div>
    </section>

    <footer class="footer-area">
      <p id="copyrightLine1"></p>
      <p id="copyrightLine2"></p>
    </footer>
  </div>

  <script>
    // 读取配置
    const cfg = SITE_CONFIG;
    const gapSize = cfg.style.gapSize;
    const transitionCurve = cfg.style.transitionCurve;
    const slideThreshold = cfg.style.slideThreshold;

    // 填充静态文案 & 标题
    document.getElementById("dynamicTitle").innerText = cfg.siteTitle;
    document.getElementById("bannerH1").innerText = cfg.bannerTitle;
    document.getElementById("bannerSubP").innerText = cfg.bannerSub;

    document.getElementById("cardStoryTitle").innerText = cfg.cardText.story.title;
    document.getElementById("cardStoryDesc").innerText = cfg.cardText.story.desc;
    document.getElementById("cardStoryNote").innerText = cfg.cardText.story.note;

    document.getElementById("cardDevTitle").innerText = cfg.cardText.dev.title;
    document.getElementById("cardDevDesc").innerText = cfg.cardText.dev.desc;
    document.getElementById("cardDevNote").innerText = cfg.cardText.dev.note;

    document.getElementById("cardCommunityTitle").innerText = cfg.cardText.community.title;
    document.getElementById("cardCommunityDesc").innerText = cfg.cardText.community.desc;
    document.getElementById("cardCommunityNote").innerText = cfg.cardText.community.note;

    document.getElementById("cardSupportTitle").innerText = cfg.cardText.support.title;
    document.getElementById("cardSupportDesc").innerText = cfg.cardText.support.desc;

    document.getElementById("cardAboutTitle").innerText = cfg.cardText.about.title;
    document.getElementById("cardAboutCreator").innerText = "创作者：" + cfg.copyrightAuthor;
    document.getElementById("cardAboutDesc").innerText = cfg.cardText.about.desc;

    document.getElementById("btnWatchStory").innerText = cfg.btnText.watchStory;
    document.getElementById("btnGithub").innerText = cfg.btnText.github;
    document.getElementById("btnTest").innerText = cfg.btnText.applyTest;
    document.getElementById("btnWiki").innerText = cfg.btnText.wiki;
    document.getElementById("btnQQChannel").innerText = cfg.btnText.qqChannel;
    document.getElementById("btnQQGroup").innerText = cfg.btnText.qqGroup;
    document.getElementById("btnCopyMail").innerText = cfg.btnText.copyMail;
    document.getElementById("btnKS").innerText = cfg.btnText.kuaishou;
    document.getElementById("btnXHS").innerText = cfg.btnText.xiaohongshu;
    document.getElementById("btnBili").innerText = cfg.btnText.bilibili;
    document.getElementById("btnLofter").innerText = cfg.btnText.lofter;

    document.getElementById("copyrightLine1").innerText =
      "Copyright © " + cfg.copyrightStartYear + "–" + cfg.copyrightEndYear + " " + cfg.copyrightAuthor + " 版权所有";
    document.getElementById("copyrightLine2").innerText =
      "本网页著作权受《中华人民共和国著作权法》《信息网络传播权保护条例》保护，禁止未经授权复制与商用。";

    // 动态渲染轮播图 & 小圆点
    const track = document.getElementById("carouselTrack");
    const dotWrap = document.getElementById("dotWrap");
    cfg.carouselList.forEach((item, idx) => {
      const div = document.createElement("div");
      div.className = "carousel-item";
      div.dataset.target = item.targetDetailId;

      const img = document.createElement("img");
      img.src = item.imgSrc;
      img.alt = item.imgAlt;
      div.appendChild(img);
      track.appendChild(div);

      const dot = document.createElement("span");
      dot.className = "dot" + (idx === 0 ? " active" : "");
      dot.dataset.index = idx;
      dotWrap.appendChild(dot);
    });

    // 轮播逻辑
    const dots = document.querySelectorAll(".dot");
    const carouselItems = document.querySelectorAll(".carousel-item");
    const arrowLeft = document.getElementById("arrowLeft");
    const arrowRight = document.getElementById("arrowRight");
    const wrap = document.getElementById("carouselWrap");
    let currentSlide = 0;
    const totalSlides = carouselItems.length;

    function setSlide(idx) {
      if (idx < 0) idx = totalSlides - 1;
      if (idx >= totalSlides) idx = 0;
      currentSlide = idx;
      track.style.transition = "transform 0.45s " + transitionCurve;
      track.style.transform = `translateX(calc(-${idx} * (calc((100% - ${gapSize}px)/1) + ${gapSize}px)))`;
      dots.forEach((d, i) => d.classList.toggle("active", i === idx));
    }

    arrowLeft.addEventListener("click", () => setSlide(currentSlide - 1));
    arrowRight.addEventListener("click", () => setSlide(currentSlide + 1));
    dots.forEach((dot, i) => dot.addEventListener("click", () => setSlide(i)));

    carouselItems.forEach(item => {
      item.addEventListener("click", function () {
        const targetId = this.dataset.target;
        const el = document.getElementById(targetId);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    // 触摸 & 鼠标拖动滑动
    let startX = 0, moveX = 0, isDragging = false;
    function onStart(x) { isDragging = true; startX = x; moveX = 0; track.style.transition = "none"; }
    function onMove(x) {
      if (!isDragging) return;
      moveX = x - startX;
      const base = -currentSlide * (100 + gapSize / wrap.offsetWidth * 100);
      const offset = (moveX / wrap.offsetWidth) * 100;
      track.style.transform = `translateX(${base + offset}%)`;
    }
    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      if (moveX < -slideThreshold) setSlide(currentSlide + 1);
      else if (moveX > slideThreshold) setSlide(currentSlide - 1);
      else setSlide(currentSlide);
      moveX = 0;
    }
    wrap.addEventListener("touchstart", e => onStart(e.touches[0].clientX), { passive: true });
    wrap.addEventListener("touchmove", e => onMove(e.touches[0].clientX), { passive: true });
    wrap.addEventListener("touchend", onEnd);
    wrap.addEventListener("mousedown", e => onStart(e.clientX));
    window.addEventListener("mousemove", e => { if (isDragging) onMove(e.clientX); });
    window.addEventListener("mouseup", onEnd);
    wrap.addEventListener("dragstart", e => e.preventDefault());

    // 卡片滚动淡入
    const detailCards = document.querySelectorAll(".detail-card");
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("show"); });
    }, { threshold: 0.12 });
    detailCards.forEach(card => observer.observe(card));

    // 复制邮箱 & 打开链接
    const copyBtn = document.getElementById("btnCopyMail");
    const copyTip = document.getElementById("copy-ok");
    copyBtn.addEventListener("click", function () {
      navigator.clipboard.writeText(cfg.contactEmail);
      copyTip.style.display = "block";
      setTimeout(() => copyTip.style.display = "none", 2500);
    });

    function bindLink(btnId, linkUrl) {
      document.getElementById(btnId).addEventListener("click", () => {
        if (linkUrl.startsWith("http")) window.open(linkUrl, "_blank");
        else alert("链接尚未配置：" + linkUrl);
      });
    }
    bindLink("btnWatchStory", cfg.links.storyPlatform);
    bindLink("btnGithub", cfg.links.githubRepo);
    bindLink("btnTest", cfg.links.testApply);
    bindLink("btnWiki", cfg.links.wiki);
    bindLink("btnQQChannel", cfg.links.qqChannel);
    bindLink("btnQQGroup", cfg.links.qqGroup);
    bindLink("btnKS", cfg.links.kuaishou);
    bindLink("btnXHS", cfg.links.xiaohongshu);
    bindLink("btnBili", cfg.links.bilibili);
    bindLink("btnLofter", cfg.links.lofter);
  </script>
</body>
</html>
